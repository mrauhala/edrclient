<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Globe/Earth representation -->
  <circle cx="100" cy="100" r="75" fill="url(#globeGradient)" opacity="0.9"/>
  
  <!-- Latitude lines -->
  <ellipse cx="100" cy="100" rx="75" ry="20" fill="none" stroke="#64B5F6" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="100" cy="100" rx="75" ry="40" fill="none" stroke="#64B5F6" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Longitude lines -->
  <ellipse cx="100" cy="100" rx="20" ry="75" fill="none" stroke="#64B5F6" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="100" cy="100" rx="40" ry="75" fill="none" stroke="#64B5F6" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Equator -->
  <line x1="25" y1="100" x2="175" y2="100" stroke="#90CAF9" stroke-width="2" opacity="0.8"/>
  
  <!-- Data points representing environmental data -->
  <circle cx="70" cy="60" r="5" fill="url(#dataGradient)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="80" r="5" fill="url(#dataGradient)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="120" r="5" fill="url(#dataGradient)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="130" r="5" fill="url(#dataGradient)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Data retrieval arrows/signals -->
  <path d="M 70 60 Q 85 40 100 30" fill="none" stroke="#4CAF50" stroke-width="2" opacity="0.7">
    <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 130 80 Q 115 60 100 30" fill="none" stroke="#4CAF50" stroke-width="2" opacity="0.7">
    <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Central API endpoint indicator -->
  <circle cx="100" cy="30" r="8" fill="#FF9800" stroke="#F57C00" stroke-width="2">
    <animate attributeName="r" values="8;10;8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>